{% extends 'base.html' %}


{% block content %}



<div class="min-h-[70vh] flex items-center justify-center">



<div class="bg-white rounded-2xl shadow-xl p-8 w-full max-w-lg">





<h2 class="text-4xl font-bold text-red-600 text-center mb-6">

Raise Dispute

</h2>







<div class="bg-gray-50 rounded-xl p-5 mb-6">





<p>

Order:

<strong>

#{{ order.id }}

</strong>

</p>





<p class="mt-2">

Seller:

<strong>

{{ order.seller.username }}

</strong>

</p>





<p class="mt-2">

Order Amount:

<span class="font-bold text-green-700">

৳{{ order.total_amount }}

</span>

</p>





<p class="mt-2">

Order Status:

<strong>

{{ order.get_status_display }}

</strong>

</p>





</div>








<hr class="my-6">






<form method="POST">


{% csrf_token %}






<div class="space-y-4">


{{ form.as_p }}


</div>







<button

type="submit"

class="w-full mt-6 bg-red-600 text-white py-3 rounded-lg font-semibold hover:bg-red-700 transition"

>

Submit Dispute

</button>






</form>







<a

href="{% url 'my_orders' %}"

class="block text-center mt-6 text-green-700 font-semibold"

>

← Back to My Orders

</a>






</div>



</div>




{% endblock %}
