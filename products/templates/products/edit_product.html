{% extends 'base.html' %}


{% block content %}



<div class="max-w-3xl mx-auto">



<div class="bg-white rounded-2xl shadow-lg p-8">



<h2 class="text-4xl font-bold text-gray-800 mb-8">

Edit Product

</h2>





<form method="POST"
enctype="multipart/form-data"
class="space-y-5">


{% csrf_token %}




<div class="space-y-4">


{{ form.as_p }}


</div>






<button

type="submit"

class="w-full bg-green-700 text-white py-3 rounded-lg font-semibold hover:bg-green-800 transition"

>

Save Changes

</button>




</form>






<a

href="{% url 'my_products' %}"

class="inline-block mt-6 text-green-700 font-semibold"

>

← Back to My Products

</a>




</div>


</div>



{% endblock %}
