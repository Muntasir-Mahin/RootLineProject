{% extends 'base.html' %}
{% block content %}
<div class="workflow-page page-edit-product">
<div class="max-w-3xl mx-auto">
<div class="bg-white rounded-2xl shadow-lg p-8 ui-card">
<header class="page-heading"><p class="section-eyebrow">SELLER STUDIO</p><h1>Edit Product</h1><p class="page-description">Keep your listing fresh and accurate.</p></header>
<form method="POST"
enctype="multipart/form-data"
class="space-y-5 modern-form">
{% csrf_token %}
<div class="space-y-4">
{% include 'components/form_fields.html' %}
</div>
<button
type="submit"
class="w-full py-3 rounded-lg font-semibold transition primary-action"
>
Save Changes
</button>
</form>
<a
href="{% url 'my_products' %}"
class="inline-block mt-6 text-green-700 font-semibold"
>
← Back to My Products
</a>
</div>
</div>
</div>
{% endblock %}
