<!DOCTYPE html>
<html>
<head>
    <title>Delete Product | RootLine</title>
</head>
<body>

<h2>Delete Product</h2>

<p>
    Are you sure you want to delete
    <strong>{{ product.name }}</strong>?
</p>

<form method="POST">
    {% csrf_token %}
    <button type="submit">Yes, Delete</button>
</form>

<br>

<a href="{% url 'my_products' %}">
    Cancel
</a>

</body>
</html>
