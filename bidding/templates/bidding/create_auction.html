<!DOCTYPE html>
<html>
<head>
    <title>Create Auction | RootLine</title>
</head>
<body>

<h2>Create Auction</h2>

<h3>{{ product.name }}</h3>

<p>
    Selling Type:
    {{ product.get_selling_type_display }}
</p>

<form method="POST">

    {% csrf_token %}

    {{ form.as_p }}

    <button type="submit">
        Create Auction
    </button>

</form>

<br>

<a href="{% url 'my_products' %}">
    Back to My Products
</a>

</body>
</html>
