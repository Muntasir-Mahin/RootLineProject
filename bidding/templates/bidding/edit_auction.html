{% extends 'base.html' %}
{% block content %}
<div class="workflow-page page-edit-auction">
<div class="min-h-[70vh] flex items-center justify-center">
<div class="bg-white rounded-2xl shadow-xl p-8 w-full max-w-lg ui-card">
<header class="page-heading"><p class="section-eyebrow">SELLER STUDIO</p><h1>Edit Auction</h1><p class="page-description">Fine-tune the details of your upcoming auction.</p></header>
<div class="bg-gray-50 rounded-lg p-5 mb-6">
<h3 class="text-2xl font-bold text-gray-800">
{{ auction.product.name }}
</h3>
</div>
<form method="POST" class="space-y-5 modern-form">
{% csrf_token %}
<div class="space-y-4">
{% include 'components/form_fields.html' %}
</div>
<button
type="submit"
class="w-full py-3 rounded-lg font-semibold transition primary-action"
>
Save Auction Changes
</button>
</form>
<a
href="{% url 'my_products' %}"
class="block text-center mt-6 text-green-700 font-semibold"
>
← Back to My Products
</a>
</div>
</div>
</div>
{% endblock %}
