{% extends 'base.html' %}
{% block content %}
<div class="workflow-page page-edit-profile">
<div class="min-h-[70vh] flex items-center justify-center">
<div class="bg-white shadow-xl rounded-2xl p-8 w-full max-w-lg ui-card">
<header class="page-heading"><p class="section-eyebrow">YOUR ACCOUNT</p><h1>Edit Profile</h1><p class="page-description">Make your details feel like you.</p></header>
<form method="POST" class="space-y-5 modern-form">
{% csrf_token %}
<div class="space-y-4">
{% include 'components/form_fields.html' %}
</div>
<button
type="submit"
class="w-full py-3 rounded-lg font-semibold transition primary-action"
>
Save Changes
</button>
</form>
<a
href="{% url 'profile' %}"
class="block text-center mt-6 text-green-700 font-semibold"
>
← Back to Profile
</a>
</div>
</div>
</div>
{% endblock %}
