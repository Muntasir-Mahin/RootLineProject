{% extends 'base.html' %}


{% block content %}



<div class="min-h-[70vh] flex items-center justify-center">



<div class="bg-white shadow-xl rounded-2xl p-8 w-full max-w-md">



<h2 class="text-4xl font-bold text-gray-800 text-center mb-8">

Login to RootLine

</h2>




<form method="POST" class="space-y-5">


{% csrf_token %}





<div>


<label class="block text-gray-700 font-semibold mb-2">

Username

</label>



<input

type="text"

name="username"

required

class="w-full border rounded-lg px-4 py-3 focus:outline-none focus:ring-2 focus:ring-green-500"

placeholder="Enter username"

>


</div>







<div>


<label class="block text-gray-700 font-semibold mb-2">

Password

</label>



<input

type="password"

name="password"

required

class="w-full border rounded-lg px-4 py-3 focus:outline-none focus:ring-2 focus:ring-green-500"

placeholder="Enter password"

>


</div>







<button

type="submit"

class="w-full bg-green-700 text-white py-3 rounded-lg font-semibold hover:bg-green-800 transition"

>

Login

</button>




</form>






<div class="text-center mt-6">


<p class="text-gray-600">

Don't have an account?

</p>



<a

href="{% url 'register' %}"

class="text-green-700 font-semibold"

>

Create Account

</a>



</div>




</div>



</div>



{% endblock %}
