{% extends 'base.html' %}


{% block content %}



<div class="min-h-[70vh] flex items-center justify-center">



<div class="bg-white shadow-xl rounded-2xl p-8 w-full max-w-lg">



<h2 class="text-4xl font-bold text-gray-800 text-center mb-8">

Change Password

</h2>





<form method="POST" class="space-y-5">


{% csrf_token %}




<div class="space-y-4">


{{ form.as_p }}


</div>





<button

type="submit"

class="w-full bg-green-700 text-white py-3 rounded-lg font-semibold hover:bg-green-800 transition"

>

Change Password

</button>




</form>







<a

href="{% url 'profile' %}"

class="block text-center mt-6 text-green-700 font-semibold"

>

← Back to Profile

</a>





</div>



</div>




{% endblock %}
